[project]
name = "gtm-analyst"
version = "0.1.0"
description = "A GTM analyst you can audit: governed analytics agents on Snowflake"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Rama Kattunga" }]
keywords = ["snowflake", "analytics", "agents", "governance", "evaluation", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "snowflake-connector-python>=3.12",
    "cryptography>=42.0",
    "click>=8.1",
    "mcp>=1.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "dbt-core>=1.8", "dbt-snowflake>=1.8"]

[project.scripts]
gtm = "gtm_analyst.cli:cli"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
