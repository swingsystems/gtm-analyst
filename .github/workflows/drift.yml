# Privilege drift is the failure nothing else catches.
#
# CI on a pull request sees the code. Convergence sees a deploy. Neither sees
# somebody granting a persona role to a human user on a Tuesday, which re-opens
# role escalation -- the finding that opened this project's threat model.
#
# This needs an ADMIN credential, and deliberately not the CI one. Reading the
# account's grant set requires SECURITYADMIN or ACCOUNTADMIN, while the CI user
# holds GAA_LOADER and nothing else -- giving CI an admin role so this job could
# run would hand a public runner the keys to the boundary it is meant to watch.
#
# So it uses separate secrets, SNOWFLAKE_ADMIN_USER and SNOWFLAKE_ADMIN_KEY.
# Without them the job warns that drift is NOT being checked rather than passing
# green. Running `make check-drift` from an operator machine is the other
# perfectly good answer, and the honest default for most adopters.
name: privilege-drift

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Check the credentials exist
        id: creds
        run: |
          if [ -z "${{ secrets.SNOWFLAKE_ADMIN_USER }}" ]; then
            echo "::warning::No SNOWFLAKE_ADMIN_USER configured; privilege drift is NOT being checked in CI."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.creds.outputs.configured == 'true'
        run: uv sync --all-extras

      - if: steps.creds.outputs.configured == 'true'
        name: Compare live grants against the committed baseline
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_ADMIN_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/key.p8
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_ADMIN_KEY_PASSPHRASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: GAA
          SNOWFLAKE_SCHEMA: MARTS
          SNOWFLAKE_SERVICE_USER_PREFIX: GAA_SVC_
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_ADMIN_KEY }}" > /tmp/key.p8
          chmod 600 /tmp/key.p8
          uv run python -m scripts.privilege_snapshot \
            --baseline governance-baseline/grants.json
