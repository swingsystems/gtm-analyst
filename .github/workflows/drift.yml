# Privilege drift is the failure nothing else catches.
#
# CI on a pull request sees the code. Convergence sees a deploy. Neither sees
# somebody granting a persona role to a human user on a Tuesday, which re-opens
# role escalation -- the finding that opened this project's threat model.
#
# Requires a read-only Snowflake service account. Without the secrets this job
# does not run, and it says so rather than passing green.
name: privilege-drift

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      - name: Check the credentials exist
        id: creds
        run: |
          if [ -z "${{ secrets.SNOWFLAKE_ACCOUNT }}" ]; then
            echo "::warning::No Snowflake credentials configured; drift is NOT being checked."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.creds.outputs.configured == 'true'
        run: uv sync --all-extras

      - if: steps.creds.outputs.configured == 'true'
        name: Compare live grants against the committed baseline
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/key.p8
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: GAA
          SNOWFLAKE_SCHEMA: MARTS
          SNOWFLAKE_SERVICE_USER_PREFIX: GAA_SVC_
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/key.p8
          chmod 600 /tmp/key.p8
          uv run python -m scripts.privilege_snapshot \
            --baseline governance-baseline/grants.json
